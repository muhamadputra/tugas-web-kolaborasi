<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Utama - Kolaborasi Web</title>
    
    <!-- 1. Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eef2f7;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* Disesuaikan agar navbar ada di paling atas */
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .main-card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 26px;
            color: #1a252f;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* 2. Penggunaan Flexbox sesuai instruksi tugas */
        .flex-menu {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
        }

        .card-menu {
            flex: 1;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 25px 20px;
            border-radius: 10px;
            text-decoration: none;
            color: #2d3748;
            transition: all 0.3s ease;
        }

        .card-menu:hover {
            border-color: #4a90e2;
            transform: translateY(-4px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.15);
        }

        .card-menu h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #2b6cb0;
        }

        .card-menu p {
            font-size: 13px;
            color: #718096;
            margin-bottom: 0;
        }

        /* 3. Media Query untuk Layar Kecil / HP sesuai instruksi tugas */
        @media (max-width: 576px) {
            .flex-menu {
                flex-direction: column; /* Mengubah flexbox jadi menumpuk ke bawah di HP */
            }
        }
    </style>
</head>
<body>

    <!-- 4. Navbar Bootstrap untuk menghubungkan halaman -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid container">
            <a class="navbar-brand fw-bold" href="index.html">Proyek Kolaborasi</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="putra.html">Halaman Putra</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="akbar.html">Halaman Akbar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <div class="content-wrapper">
        <div class="main-card">
            <h1>Proyek Kolaborasi Web</h1>
            <p class="subtitle">Silakan pilih halaman anggota kelompok di bawah ini untuk melihat detail masing-masing:</p>

            <!-- Menu menggunakan Flexbox -->
            <div class="flex-menu">
                <a href="putra.html" class="card-menu">
                    <h3>Anggota 1</h3>
                    <p>Halaman Putra</p>
                </a>

                <a href="akbar.html" class="card-menu">
                    <h3>Anggota 2</h3>
                    <p>Halaman Akbar</p>
                </a>
            </div>
        </div>
    </div>

    <!-- 5. Bootstrap JS Bundle (Wajib agar tombol toggle responsive di HP bisa di-klik) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
